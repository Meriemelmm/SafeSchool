name: Continuous Deployment

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # Cette étape s'assure que le déploiement ne se lance que si les secrets sont présents
    if: github.repository == 'Meriemelmm/SafeSchool'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy API
        run: |
          curl -X POST "https://api.render.com/deploy/${{ secrets.RENDER_API_SERVICE_ID }}" \
          -H "Accept: application/json" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"

      - name: Deploy Web
        run: |
          curl -X POST "https://api.render.com/deploy/${{ secrets.RENDER_WEB_SERVICE_ID }}" \
          -H "Accept: application/json" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"